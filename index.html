function changeModel(){protoModel=modelBank[$('modelSelect').value];predictProto();}
function drawComparison(k){$('modelComparison').innerHTML='<table><thead><tr><th>모델</th><th>MAE</th><th>RMSE</th><th>R²</th></tr></thead><tbody>'+Object.entries(modelBank).map(([key,m])=>`<tr class="${key===$('modelSelect').value?'selected-model':''}"><td>${m.name}</td><td>${fmt(m.mae[k])}</td><td>${fmt(m.rmse[k])}</td><td>${m.r2[k].toFixed(3)}</td></tr>`).join('')+'</tbody></table>';}

function showVideo(){setPage('video');document.body.classList.remove('heat','prediction');document.body.classList.add('video-page');document.querySelector('.controls').hidden=true;$('heatControls').hidden=true;$('charts').innerHTML='<section class="video-stage"><video id="principleVideo" controls playsinline preload="metadata"><source src="foam-injection.mp4" type="video/mp4">브라우저에서 MP4 재생을 지원하지 않습니다.</video></section>';if(typeof decorateVideo==='function')decorateVideo();}

let treeViewMode='path',treeOpenNodes=new Set(),treeClosedNodes=new Set(),treeZoom=1;
function setTreeExpansion(expand){treeViewMode=expand?'all':'collapsed';treeOpenNodes.clear();treeClosedNodes.clear();drawTreeInspector();}
function resetTreePath(){treeViewMode='path';treeOpenNodes.clear();treeClosedNodes.clear();drawTreeInspector();}
function toggleTreeNode(id,open){if(open){treeClosedNodes.add(id);treeOpenNodes.delete(id);}else{treeOpenNodes.add(id);treeClosedNodes.delete(id);}drawTreeInspector();}
function zoomTree(factor){treeZoom=Math.max(.35,Math.min(1.5,treeZoom*factor));const svg=$('treeDiagram');if(svg){svg.style.width=svg.dataset.width*treeZoom+'px';svg.style.height=svg.dataset.height*treeZoom+'px';}}
function drawTreeInspector(){
 const host=$('treeInspector');if(!host)return;host.hidden=$('modelSelect').value!=='tree';if(host.hidden)return;
 const k=+$('validationMetric').value,t=modelBank.tree.trees[k][0],vals=[0,1,2,3].map(i=>+$('px'+i).value),centers=[1,205,150,90],scales=[.5,15,50,5],x=vals.map((v,i)=>Math.fround((v-centers[i])/scales[i]));
 const path=[],steps=[];let n=0;
 while(t.left[n]!==-1){path.push(n);const f=t.feature[n],left=x[f]<=t.threshold[n],threshold=t.threshold[n]*scales[f]+centers[f];steps.push({f,left,threshold});n=left?t.left[n]:t.right[n];}path.push(n);
 const u=['g','mm','MPa','개/cm³'][k],title=['캐비티 중량','버블 반지름','버블 압력 (평균)','버블 수 밀도'][k];
 const nodes=[],edges=[];let leafCount=0,maxDepth=0;
 function layout(id,depth){const leaf=t.left[id]===-1,open=!leaf&&!treeClosedNodes.has(id)&&(treeViewMode==='all'||treeOpenNodes.has(id)||(treeViewMode==='path'&&(depth<2||path.includes(id))));const node={id,depth,leaf,open,x:0,y:depth*130+30};nodes.push(node);maxDepth=Math.max(maxDepth,depth);if(open){const l=layout(t.left[id],depth+1),r=layout(t.right[id],depth+1);node.x=(l.x+r.x)/2;edges.push({from:node,to:l,yes:true},{from:node,to:r,yes:false});}else{node.x=leafCount++*220+120;}return node;}
 layout(0,0);const width=Math.max(720,leafCount*220+20),height=(maxDepth+1)*130+30;
 const lines=edges.map(e=>{const active=path.includes(e.from.id)&&path.includes(e.to.id),color=active?'#2873bd':'#b8c5d3',mid=e.from.y+94;return `<path d="M${e.from.x} ${e.from.y+68} V${mid} H${e.to.x} V${e.to.y}" fill="none" stroke="${color}" stroke-width="${active?3:1.5}"/><text x="${e.to.x+8}" y="${e.to.y-10}" font-size="12" fill="${color}">${e.yes?'예 (≤)':'아니요 (&gt;)'}</text>`}).join('');
 const boxes=nodes.map(node=>{const id=node.id,active=path.includes(id),f=t.feature[id],threshold=node.leaf?0:t.threshold[id]*scales[f]+centers[f],heading=node.leaf?'예측 결과':names[f],value=node.leaf?fmt(t.value[id])+' '+u:'≤ '+fmt(threshold)+' '+units[f],sub=node.leaf?(active?'현재 도달한 말단 노드':'말단 노드'):(node.open?'− 접기':'+ 펼치기');return `<g ${node.leaf?'':`role="button" tabindex="0" aria-expanded="${node.open}" aria-label="${heading} ${value}" onclick="toggleTreeNode(${id},${node.open})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTreeNode(${id},${node.open})}"`} style="cursor:${node.leaf?'default':'pointer'}"><rect x="${node.x-96}" y="${node.y}" width="192" height="68" rx="${node.leaf?20:9}" fill="${active?'#e9f3ff':'white'}" stroke="${active?'#2873bd':'#cbd5e1'}" stroke-width="${active?2.5:1}"/><text x="${node.x}" y="${node.y+19}" text-anchor="middle" font-size="12" fill="#53657a">${heading}</text><text x="${node.x}" y="${node.y+39}" text-anchor="middle" font-size="14" font-weight="700" fill="#173e69">${value}</text><text x="${node.x}" y="${node.y+56}" text-anchor="middle" font-size="10" fill="#64748b">${sub}</text></g>`}).join('');
 const diagram=`<svg id="treeDiagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" data-width="${width}" data-height="${height}" style="width:${width*treeZoom}px;height:${height*treeZoom}px" role="group" aria-label="${title} 결정트리 분기 구조">${lines}${boxes}</svg>`;
 host.innerHTML=`<div class="tree-toolbar"><h2>결정트리 내부 구조</h2><button type="button" onclick="setTreeExpansion(true)">전체 펼치기</button><button type="button" onclick="setTreeExpansion(false)">전체 접기</button><button type="button" onclick="resetTreePath()">현재 경로 보기</button><button type="button" onclick="zoomTree(.8)" aria-label="트리 축소">−</button><button type="button" onclick="zoomTree(1.25)" aria-label="트리 확대">＋</button></div><p>${title} · 파란색: 입력 조건의 예측 경로 (평가 25개와 별개)</p><div class="tree-path">${steps.map((step,i)=>`<div class="tree-step"><b>${i+1}. ${names[step.f]} ${fmt(vals[step.f])} ${units[step.f]}</b>${fmt(step.threshold)} ${units[step.f]} ${step.left?'이하 → 예':'초과 → 아니요'}</div>`).join('')}<div class="tree-step"><b>최종 예측</b>${fmt(t.value[n])} ${u}</div></div><div class="tree-scroll">${diagram}</div>`;
}

async function toggleFullscreen(){
 try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
 catch{ $('fullscreenButton').textContent='F11 전체화면'; }
}
document.addEventListener('fullscreenchange',()=>{$('fullscreenButton').textContent=document.fullscreenElement?'⛶ 화면 복귀':'⛶ 전체화면'});
let lastChartSize='',resizeFrame;
new ResizeObserver(entries=>{
 const r=entries[0].contentRect,key=Math.round(r.width)+':'+Math.round(r.height);
 if(key===lastChartSize)return;lastChartSize=key;
 cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if($('graphButton').classList.contains('active'))render();else if($('bubbleFocusCharts'))drawBubbleFocusCharts();else if($('predictionButton').classList.contains('active')&&$('validationPlot'))drawValidation()});
}).observe($('charts'));
</script></html>
